name: YogaAtlas
options:
  bundleIdPrefix: com.tokyonasu
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.3"

settings:
  base:
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: 83VGKGSQUH
    CODE_SIGN_STYLE: Automatic

targets:
  YogaAtlas:
    type: application
    platform: iOS
    sources:
      - path: YogaAtlas
    resources:
      - path: YogaAtlas/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.YogaAtlas
        INFOPLIST_FILE: YogaAtlas/Info.plist

configs:
  Debug: debug
  Release: release
