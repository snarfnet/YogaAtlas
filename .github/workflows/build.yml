name: Build and Upload to App Store

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode
      run: |
        XCODE_APP=$(ls /Applications/ | grep -E "^Xcode_2[6-9]|^Xcode_[3-9][0-9]" | sort -V | tail -1)
        if [ -n "$XCODE_APP" ]; then
          sudo xcode-select -s "/Applications/$XCODE_APP"
        else
          XCODE_APP=$(ls /Applications/ | grep "^Xcode_" | sort -V | tail -1)
          sudo xcode-select -s "/Applications/$XCODE_APP"
        fi
        xcodebuild -version

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Set build number
      run: |
        BUILD_NUM=$(TZ=Asia/Tokyo date +%Y%m%d%H%M)
        echo "BUILD_NUM=$BUILD_NUM" >> $GITHUB_ENV
        sed -i "" -E "s/CURRENT_PROJECT_VERSION: \"?[0-9]+\"?/CURRENT_PROJECT_VERSION: \"$BUILD_NUM\"/" project.yml

    - name: Generate Xcode project
      run: xcodegen generate

    - name: Select simulator
      run: |
        SIM_UDID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(dev["udid"] for runtime in d["devices"].values() for dev in runtime if dev.get("isAvailable") and "iPhone" in dev["name"]))')
        echo "SIM_UDID=$SIM_UDID" >> $GITHUB_ENV
        echo "Using simulator $SIM_UDID"

    - name: Generate App Store screenshots
      run: |
        set -euo pipefail
        xcodebuild build \
          -scheme YogaAtlas \
          -configuration Debug \
          -destination "platform=iOS Simulator,id=$SIM_UDID" \
          -derivedDataPath build/ScreenshotDerivedData

        APP_PATH=$(find build/ScreenshotDerivedData/Build/Products/Debug-iphonesimulator -name "YogaAtlas.app" -maxdepth 2 | head -1)
        mkdir -p screenshots/raw screenshots/appstore

        xcrun simctl boot "$SIM_UDID" || true
        xcrun simctl bootstatus "$SIM_UDID" -b
        xcrun simctl install "$SIM_UDID" "$APP_PATH"

        INDEX=1
        for SCREEN in home prescription meditation; do
          xcrun simctl terminate "$SIM_UDID" com.tokyonasu.YogaAtlas || true
          xcrun simctl launch "$SIM_UDID" com.tokyonasu.YogaAtlas -screenshots -screenshotScreen "$SCREEN"
          sleep 8
          xcrun simctl io "$SIM_UDID" screenshot "screenshots/raw/iphone_${INDEX}_${SCREEN}.png"
          INDEX=$((INDEX + 1))
        done
        xcrun simctl shutdown "$SIM_UDID" || true

        cp screenshots/raw/iphone_1_home.png screenshots/raw/ipad_1_home.png
        cp screenshots/raw/iphone_2_prescription.png screenshots/raw/ipad_2_prescription.png
        cp screenshots/raw/iphone_3_meditation.png screenshots/raw/ipad_3_meditation.png

        sips -z 2796 1290 screenshots/raw/iphone_1_home.png --out screenshots/appstore/iphone_1_home.png
        sips -z 2796 1290 screenshots/raw/iphone_2_prescription.png --out screenshots/appstore/iphone_2_prescription.png
        sips -z 2796 1290 screenshots/raw/iphone_3_meditation.png --out screenshots/appstore/iphone_3_meditation.png
        sips -z 2732 2048 screenshots/raw/ipad_1_home.png --out screenshots/appstore/ipad_1_home.png
        sips -z 2732 2048 screenshots/raw/ipad_2_prescription.png --out screenshots/appstore/ipad_2_prescription.png
        sips -z 2732 2048 screenshots/raw/ipad_3_meditation.png --out screenshots/appstore/ipad_3_meditation.png

    - name: Patch Info.plist build number
      run: |
        /usr/libexec/PlistBuddy -c "Set :CFBundleIconName AppIcon" YogaAtlas/Info.plist || /usr/libexec/PlistBuddy -c "Add :CFBundleIconName string AppIcon" YogaAtlas/Info.plist
        /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.3" YogaAtlas/Info.plist || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 1.3" YogaAtlas/Info.plist
        sed -i "" "s|<string>\$(CURRENT_PROJECT_VERSION)</string>|<string>$BUILD_NUM</string>|" YogaAtlas/Info.plist
        sed -i "" "/<key>CFBundleVersion<\/key>/{n;s|<string>[^<]*</string>|<string>$BUILD_NUM</string>|;}" YogaAtlas/Info.plist

    - name: Import Distribution Certificate
      env:
        CERT_BASE64: ${{ secrets.DIST_CERT_BASE64 }}
        CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      run: |
        security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
        security default-keychain -s build.keychain
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
        security set-keychain-settings -t 3600 -u build.keychain
        echo "$CERT_BASE64" | base64 -D > cert.p12
        security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
        rm cert.p12

    - name: Set up ASC API Key
      env:
        ASC_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
      run: |
        mkdir -p ~/.appstoreconnect/private_keys
        echo "$ASC_API_KEY_CONTENT" | base64 -D > ~/.appstoreconnect/private_keys/AuthKey_WDXGY9WX55.p8
        cp ~/.appstoreconnect/private_keys/AuthKey_WDXGY9WX55.p8 /tmp/asc_key.p8

    - name: Build Archive
      run: |
        xcodebuild archive \
          -scheme YogaAtlas \
          -configuration Release \
          -destination "generic/platform=iOS" \
          -archivePath build/YogaAtlas.xcarchive \
          CODE_SIGN_STYLE=Automatic \
          DEVELOPMENT_TEAM=83VGKGSQUH \
          -allowProvisioningUpdates \
          -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_WDXGY9WX55.p8 \
          -authenticationKeyID WDXGY9WX55 \
          -authenticationKeyIssuerID 2be0734f-943a-4d61-9dc9-5d9045c46fec

    - name: Patch archived app icon metadata
      run: |
        set -euo pipefail
        APP_PATH=$(find build/YogaAtlas.xcarchive -type d -name "*.app" | head -1)
        test -n "$APP_PATH"
        INFO="$APP_PATH/Info.plist"
        /usr/libexec/PlistBuddy -c "Set :CFBundleIconName AppIcon" "$INFO" || /usr/libexec/PlistBuddy -c "Add :CFBundleIconName string AppIcon" "$INFO"
        /usr/libexec/PlistBuddy -c "Delete :CFBundleIcons" "$INFO" || true
        /usr/libexec/PlistBuddy -c "Add :CFBundleIcons dict" "$INFO"
        /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon dict" "$INFO"
        /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName string AppIcon" "$INFO"
        /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles array" "$INFO"
        /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles:0 string AppIcon60x60" "$INFO"
        /usr/libexec/PlistBuddy -c "Delete :CFBundleIcons~ipad" "$INFO" || true
        /usr/libexec/PlistBuddy -c "Add :CFBundleIcons~ipad dict" "$INFO"
        /usr/libexec/PlistBuddy -c "Add :CFBundleIcons~ipad:CFBundlePrimaryIcon dict" "$INFO"
        /usr/libexec/PlistBuddy -c "Add :CFBundleIcons~ipad:CFBundlePrimaryIcon:CFBundleIconName string AppIcon" "$INFO"
        /usr/libexec/PlistBuddy -c "Add :CFBundleIcons~ipad:CFBundlePrimaryIcon:CFBundleIconFiles array" "$INFO"
        /usr/libexec/PlistBuddy -c "Add :CFBundleIcons~ipad:CFBundlePrimaryIcon:CFBundleIconFiles:0 string AppIcon76x76" "$INFO"
        cp YogaAtlas/Assets.xcassets/AppIcon.appiconset/icon_120x120.png "$APP_PATH/AppIcon60x60@2x.png"
        cp YogaAtlas/Assets.xcassets/AppIcon.appiconset/icon_152x152.png "$APP_PATH/AppIcon76x76@2x~ipad.png"

    - name: Export IPA
      run: |
        for attempt in 1 2 3; do
          echo "Export attempt $attempt/3"
          if xcodebuild -exportArchive \
            -archivePath build/YogaAtlas.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist export_options.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_WDXGY9WX55.p8 \
            -authenticationKeyID WDXGY9WX55 \
            -authenticationKeyIssuerID 2be0734f-943a-4d61-9dc9-5d9045c46fec; then
            exit 0
          fi
          sleep 60
        done
        exit 1

    - name: Install PyJWT
      run: pip3 install --break-system-packages PyJWT requests

    - name: Submit for Review
      run: python3 scripts/submit.py ${{ env.BUILD_NUM }}
