name: YogaAtlas
options:
  bundleIdPrefix: com.tokyonasu
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.3"
  developmentLanguage: ja
  knownRegions:
    - ja
    - en

settings:
  base:
    MARKETING_VERSION: "1.3"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: 83VGKGSQUH
    CODE_SIGN_STYLE: Automatic

targets:
  YogaAtlas:
    type: application
    platform: iOS
    sources:
      - path: YogaAtlas
    resources:
      - path: YogaAtlas/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.YogaAtlas
        INFOPLIST_FILE: YogaAtlas/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleIconName: AppIcon

configs:
  Debug: debug
  Release: release
